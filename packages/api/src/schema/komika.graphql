}

type AccessStatus {
	mode: String! # "local" | "internet" | "direct" | "" (not chosen)
	domain: String
	address: String # https://<domain> in internet mode; the public address in direct mode
	lanAddresses: [String!]! # http://<address>:<port> on the home network; empty if unknown
	lanClientSeenAt: String # last private socket peer since boot (RFC 3339); null when none or in a container
	cloudflare: CloudflareSetup
	connector: String! # "off" | "starting" | "running" | "failed" | "missing"
	connectorMessage: String
	https: Boolean! # the HTTPS listener is up (public-IP origin, or direct mode with a certificate)
	httpsError: String # why that listener is down while the mode needs it; the server keeps trying
	certificateExpires: String # end of the served certificate (RFC 3339): direct mode, or the Origin CA one
	certificateError: String # direct mode: why the last renewal failed. Public IP: the Origin CA certificate is due
	plainHttpClosed: Boolean! # direct mode with HTTPS: the plain HTTP port refuses clients on the internet
	trustedProxies: [String!]!
	trustedProxiesPinned: Boolean! # TRUSTED_PROXY_CIDRS set on the server
	job: CloudflareJob
}

# One entry in a user's activity feed, written by the corresponding mutation.
type Activity {
	id: ID!
	kind: String! # "review" | "comment" | "library_add"
	targetType: String # "series" | "chapter"
	targetId: ID # series/chapter id acted on; the client resolves a title
	createdAt: String!
}

type SeriesPage {
	items: [Series!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

type ReviewPage {
	items: [Review!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

type CommentPage {
	items: [Comment!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

input PostReviewInput {
	seriesId: ID!
	score: Int!
	body: String!
	hasSpoiler: Boolean!
}

input PostCommentInput {
	targetType: String! # "chapter" | "series" | "scanlator"
	targetId: ID!
	parentId: ID # [komika] reply target; must be a comment on the same target. Omit for top-level.
	body: String!
	hasSpoiler: Boolean!
	mediaId: ID # [komika] a previously-uploaded comment-media id to attach (owned + unlinked)
}

input CreateUserInput {
	username: String!
	email: String!
	password: String!
	isAdmin: Boolean # default false
	mustChangePassword: Boolean # default true
}

input RegisterInput {
	username: String!
	email: String!
	password: String!
}

# Editable profile fields. A null/blank field clears that value (display name
# then falls back to username).
input UpdateProfileInput {
	displayName: String
	bio: String
}

# Admin "manga DB" overrides. Whole-state: a null field clears that override, so
# the console sends the full form on save.
input SeriesAdminInput {
	seriesId: ID!
	overrideIntervalHours: Float # null => derive from avgIntervalHours
	pollEveryMinutes: Int # null => default (30)
	paused: Boolean # null => auto-pause by status
	status: SeriesStatus # null => use source status
}

# [komika] Admin edits to a canonical work's user-facing metadata (series-detail
# editor). Each optional field is three-valued: OMITTED => leave unchanged; null =>
# clear the override (use the derived/source value); a value => set the override.
input SeriesMetadataInput {
	seriesId: ID! # numeric Suwayomi id or w_ canonical id — both resolve to the work
	title: String
	description: String
	type: ComicType
	isNsfw: Boolean
	tags: [String!] # full curated tag set (whole-list replace); null clears it
	# Source-owned fields. A value PINS the field so later syncs keep it; null removes
	# the pin and restores the source's value. An empty string pins the field empty.
	author: String
	artist: String
	year: Int # first publication year, 1800-2100
	originalLanguage: String # language code: ja, ko, zh, zh-hk, en, ...
	status: SeriesStatus
	demographic: Demographic # NONE pins "no demographic"
	contentRating: ContentRating
}

# [komika] Raw override state of a work for the series-detail editor (parallels how
# ScanPolicy exposes its raw overrides), so the console shows pinned vs derived.
type SeriesAdminMeta {
	workId: ID # null when the series isn't catalogued yet (nothing to pin)
	titleOverride: String
	descriptionOverride: String
	contentTypeOverride: ComicType
	isNsfwOverride: Boolean
	tags: [String!]! # effective genres (curated set if any, else source-derived)
	hasCuratedTags: Boolean! # true => `tags` is an admin-curated set
	# The work's current source-owned fields, pinned or not.
	author: String
	artist: String
	year: Int
	originalLanguage: String
	status: SeriesStatus
	demographic: Demographic
	contentRating: ContentRating
	pinnedFields: [String!]! # which of those an admin has pinned, by field name here
}

# [komika] One chapter of a work in the admin editor: aggregate identity + override
# state (hidden / renamed).
type AdminChapter {
	number: Float!
	key: String! # aggregate bucket key (the override key)
	sourceTitle: String
	titleOverride: String
	effectiveTitle: String
	hidden: Boolean!
	sourceCount: Int! # how many sources provide this chapter number
}

# [komika] Admin edit to one chapter of a work (soft-hide / rename). Fields are
# three-valued (OMITTED => unchanged) so toggling one doesn't clobber the other.
input ChapterOverrideInput {
	workId: ID!
	chapterKey: String! # from AdminChapter.key
	hidden: Boolean
	title: String
}

# [komika] Aggregate health of the adaptive scan scheduler (admin console).
type ScanStatus {
	librarySize: Int!
	overdueCount: Int!
	lastTickAt: String
	nextDueAt: String
	scannedOk: Int! # [komika] series that scanned successfully on the last tick
	scannedFailed: Int! # [komika] series whose scan errored (and were backed off) on the last tick
	lastSuccessAt: String # [komika] last tick that made real progress — diverging from lastTickAt means the scheduler is ticking without advancing
	stuckTicks: Int! # [komika] consecutive full batches that advanced nothing; 0 = healthy
}

# [komika] A user account as shown in the admin user-management console.
type AdminUser {
	id: ID!
	username: String!
	email: String!
	avatarUrl: String
	isAdmin: Boolean!
	isBanned: Boolean!
	createdAt: String!
}

type AdminUserPage {
	items: [AdminUser!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

# [komika] Outcome of the Tier-2 dedup matcher (CATALOGUE.md §4).
# `decision` is one of `auto_merge` | `review` | `new`.
type MatchResult {
	decision: String!
	workId: String!
	matchedWorkId: String
	score: Float
	method: String
	sourceSeriesId: String!
}

# [komika] One row of the canonical updates feed (CATALOGUE.md §6): a mirrored
# MangaDex work + its latest stored chapter, served from the `chapter` mirror. Open
# it via canonicalSeries(workId) — `workId` is the `w_`-prefixed canonical reader id.
type CanonicalUpdate {
	averageRating: Float
	ratingCount: Int!
	workId: String!
	mangadexId: String!
	title: String
	isNsfw: Boolean!
	coverUrl: String # proxy-ready MangaDex cover thumbnail (null until the cover is synced)
	latestChapter: String # latest stored chapter number (string; e.g. "10.5")
	latestChapterTitle: String
	latestAt: String # publish time of the latest chapter (falls back to ingest time)
}

# [komika] One page of the merged Updates feed — the same four-field envelope as
# SeriesPage. `total` counts the filtered set (NSFW posture + `type`), so the reader's
# pager can show an honest "Page 3 of N · showing 41-60 of total".
type UpdateFeedPage {
	items: [UpdateFeedRow!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

# [komika] One row of the merged Updates feed: one canonical work, its newest real
# upstream chapter release. Deliberately not a Series — the feed is ~48k rows and the
# grid renders six scalars.
type UpdateFeedRow {
	id: ID! # the id to OPEN: a `w_` canonical work id when MangaDex-anchored, else the numeric Suwayomi series id (canonicalSeries rejects a work with no MangaDex anchor, so a single-id scheme would produce cards that 404)
	workId: String! # the canonical work — the feed's dedupe key; differs from `id` for a Suwayomi-only work
	title: String!
	coverUrl: String
	type: ComicType # effective format, materialized so `type` can filter server-side
	status: SeriesStatus # publication status, materialized on feed_series_updates (migration 0068); feeds the card's status badge
	latestChapter: String # chapter NUMBER of the newest mirrored chapter; null on scanner-only rows
	latestChapterTitle: String
	chapterCount: Int # total chapters known; null on mirror-only rows
	releasedAt: String! # real upstream release time — what the SOURCE says. No longer the sort key; still what the card's detail line reports
	# When the chapter first became something we could show anyone (`feed_series_updates.announced_at`, migration 0099).
	# THE sort key of this feed, so it is also the clock the card's primary label prints — order and label must agree.
	# Differs from releasedAt only where a source held a chapter back (early access, paywall, regional delay); equal to it
	# everywhere else and on every pre-0099 row. Clients spell `announcedAt ?? releasedAt`, which is also what makes this
	# safe against a server that predates the field.
	announcedAt: String
	detectedAt: String # when OUR scanner noticed; per-SERIES, Suwayomi-only, never stamped on a baseline scan. Tooltip only, never a sort key. NOT a substitute for announcedAt
	rating: Float # aggregate rating 0-10: our readers' review average where they have rated the work, else MangaDex's community rating (statistics cache, `work_stats`); null ONLY when neither has one — the sole case the card labels "Unrated"
	readerRating: Float # our own readers' review average; null when none of them rated the work. `rating` above is the MERGED number, kept for a reader that predates this split
	mangadexRating: Float # MangaDex's community rating; null when it has none or the admin turned MangaDex ratings off
	isNsfw: Boolean!
}

# [komika] One source mapping for a canonical work: which source (and, for
# Suwayomi, which extension) a native client uses to fetch it, plus source-local
# coordinates. The dedup model (CATALOGUE.md §2) may map several to one work.
type WorkSource {
	sourceType: String! # "mangadex" | "suwayomi"
	sourceId: String! # Suwayomi source id
	sourceKey: String! # manga id/slug within the source
	sourceUrl: String
	isNsfw: Boolean!
	lang: String
	extension: SourceExtension # null for mangadex-native fetch
}

# [komika] Extension coordinates for a Suwayomi-backed source: where to get the
# APK and which package/version a native client loads. Null on a mangadex-native
# WorkSource.
type SourceExtension {
	pkgName: String!
	repoUrl: String!
	apkName: String
	versionCode: Int
	lang: String
}

# [komika] Where a Suwayomi chapter lives at its source: the source's own keys for
# the manga and the chapter, plus the extension that reads them. Ids of the
# server's engine are absent on purpose: they mean nothing to another engine.
type ChapterOrigin {
	sourceId: String!
	mangaUrl: String! # MangaType.url
	mangaTitle: String! # search hint for an engine that has never seen the manga
	chapterUrl: String! # ChapterType.url
	chapterWebUrl: String # ChapterType.realUrl: the chapter's page on the source's website ("Read on source"); validate http(s) before linking
	mangaWebUrl: String # MangaType.realUrl: the series' page on the source's website
	extension: SourceExtension # null when the source has no catalogued extension
}

# [komika] All source mappings resolved for one canonical work (batch grouping).
type WorkSourceGroup {
	workId: ID!
	sources: [WorkSource!]!
}

# [komika] One source/extension that carries a canonical work — a "translator" in
# the reader UI. For a suwayomi translator, suwayomiMangaId is the id to pass to
# chapters(seriesId:) for THIS translator's chapters; for the mangadex canonical
# spine it is null and chapters come from canonicalChapters(workId).
type Translator {
	sourceType: String! # "mangadex" (canonical spine) | "suwayomi" (an installed extension)
	sourceId: String!
	sourceName: String # display name; null when the source isn't currently installed
	lang: String
	suwayomiMangaId: ID # chapters(seriesId:) key; null for the mangadex spine
	extensionPkgName: String
	extensionIconUrl: String # browser-reachable store-hosted PNG
}

# [komika] One consolidated federated-search hit: a canonical work as a Series,
# plus the per-source translator list gathered across every installed extension.
type FederatedSeries {
	series: Series!
	translators: [Translator!]!
}

# [komika] A page of federated multi-extension search results.
type FederatedSearchPage {
	items: [FederatedSeries!]!
	page: Int!
	hasNextPage: Boolean!
	sourcesQueried: Int! # how many installed sources were queried in the fan-out
}

# [komika] Admin catalogue provenance for one Suwayomi series: the canonical work
# it's linked to (null when uncatalogued) and that work's source mappings.
type SeriesSourceGroup {
	seriesId: ID!
	workId: ID
	sources: [WorkSource!]!
}

# One extension repo on the engine (`extensionRepos`).
type ExtensionRepo {
	indexUrl: String! # canonical index URL: the repo's identity, what removeExtensionRepo takes
	name: String!
	badgeLabel: String! # short label
}

# One per-source scan rate limit (`sourceRateLimits`).
type SourceRateLimit {
	sourceId: ID! # the Suwayomi source id (`sources { id }`)
	requests: Int! # HTTP requests allowed per window
	windowSecs: Int!
	fromEnv: Boolean! # the limit in force is the server's SCAN_SOURCE_RATE_LIMITS default
	overridesEnv: Boolean! # an admin's limit replaces that default; removing it restores the default
}

# The MangaDex usage switch (`mangadexSetting`).
type MangadexSetting {
	enabled: Boolean!
	pinned: Boolean! # the server environment fixes it; setMangadexEnabled is refused
	pinnedBy: String # KOMIKA_MANGADEX or CATALOGUE_SYNC
}

# [komika] One Mihon-format extension as known to the Suwayomi engine (admin
# management view, installed or not).
type ExtensionInfo {
	pkgName: String!
	name: String!
	lang: String!
	versionName: String!
	isInstalled: Boolean!
	hasUpdate: Boolean!
	isNsfw: Boolean!
	iconUrl: String
	repo: String
	subscribed: Boolean!
}

# [komika] One installed Suwayomi source — the admin picker feeding sourceBrowse.
type SourceInfo {
	id: ID!
	name: String!
	lang: String!
	isNsfw: Boolean!
	iconUrl: String
	pkgName: String
}

# [komika] Which listing of a source to browse.
enum SourceBrowseType {
	POPULAR
	LATEST
	SEARCH
}

# [komika] One manga returned by browsing a source; suwayomiMangaId is exactly
# what bulkAddSourceSeries consumes.
type SourceBrowseEntry {
	suwayomiMangaId: ID!
	title: String!
	thumbnailUrl: String
	inLibrary: Boolean!
}

# [komika] A page of source-browse results.
type SourceBrowsePage {
	items: [SourceBrowseEntry!]!
	page: Int!
	hasNextPage: Boolean!
}

# [komika] Per-id outcome of bulkAddSourceSeries: MatchResult on success, or the
# error that made this one id fail (other ids still proceed).
type BulkAddEntry {
	suwayomiMangaId: ID!
	result: MatchResult
	error: String
}

# [komika] A background "add all from this source" ingest job (S1): walks a
# source's listing page by page through the Tier-2 dedup add flow, persisting
# progress counters. Poll sourceIngestJobs(active:true) for updates.
type SourceIngestJob {
	id: ID!
	sourceId: String!
	state: String! # running | completed | cancelled | failed
	pagesDone: Int!
	itemsSeen: Int!
	succeeded: Int!
	failed: Int!
	newWorks: Int!
	autoMerged: Int!
	queuedForReview: Int!
	alreadyExisting: Int!
	error: String # set when state = failed
	startedAt: String!
	finishedAt: String # set once terminal (completed/cancelled/failed)
}

# [komika] Result of a bulk catalogue ingest: per-id entries + decision summary.
type BulkAddResult {
	entries: [BulkAddEntry!]!
	total: Int!
	succeeded: Int!
	failed: Int!
	newWorks: Int!
	autoMerged: Int!
	queuedForReview: Int!
	alreadyExisting: Int!
}

# [komika] A pending mid-confidence match awaiting manual admin review.
type MergeCandidate {
	id: String!
	sourceSeriesId: String! # a source_series row id — NOT a work id; it cannot be looked up as one
	sourceWorkId: String! # the work that source series belongs to — what the console links/expands on
	candidateWorkId: String!
	candidateTitle: String
	sourceTitle: String
	sourceCoverUrl: String! # empty when the source work has no cover to show
	candidateCoverUrl: String! # empty when the candidate work has no cover to show
	score: Float!
	method: String!
	status: String!
	createdAt: String!
}

# [komika] One side of a dedup decision, expanded for the review panel. Read straight
# off the canonical work rather than through canonicalSeries, which refuses a work
# with no MangaDex anchor and NSFW-gates on viewer prefs — between them that is most
# of the review queue.
type WorkReviewDetail {
	workId: ID!
	title: String
	coverUrl: String! # empty when there is no cover to show
	author: String
	artist: String
	year: Int
	status: String
	contentRating: String
	originalLanguage: String
	isNsfw: Boolean!
	description: String
	chapterCount: Int! # distinct mirrored chapter numbers — a coarse completeness signal
	altTitles: [String!]! # capped server-side
	sources: [WorkSource!]! # every catalogued mapping, NSFW included (admin-gated)
}

# [komika] A page of dedup review candidates (mirrors the other admin *Page envelopes).
type MergeQueuePage {
	items: [MergeCandidate!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int # the filtered pending count, so the pager's total matches what it lists
}

# [komika] A work whose cover the crawl couldn't process (admin "Bugs" panel).
type CoverIssue {
	workId: ID!
	title: String
	coverUrl: String! # current best-effort cover; may be empty for a Suwayomi-only work with no cached cover
	reason: String! # machine code: too_large | unsupported | empty | encode | store
	detail: String
	attempts: Int!
	firstSeen: String!
	lastSeen: String!
}

type CoverIssuePage {
	items: [CoverIssue!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

# [komika] What a reader is reporting. These are the catalogue failures only a reader can
# see — `mergeQueue`/`coverIssues` already cover what the pipeline knows it got wrong.
enum ReportKind {
	WRONG_MERGE # two different series folded into one entry
	NEEDS_MERGE # the same series listed twice
	MISSING_WORK # a series absent from the catalogue (no id to point at, so `subjectTitle` carries it)
	COMMENT_ABUSE # a person in the comments, not a record
	OTHER
}

# [komika] Triage state. REJECTED ("looked at it, not a bug") is deliberately distinct
# from RESOLVED ("fixed it") — it is the more common outcome and stops re-triage.
enum ReportStatus {
	OPEN
	RESOLVED
	REJECTED
}

# [komika] One reader-filed report, as the admin queue sees it.
type Report {
	id: ID!
	kind: ReportKind!
	status: ReportStatus!
	reporter: String # username, or null when filed anonymously (allowed by design)
	subjectId: String # the series id the reader was looking at, verbatim (numeric Suwayomi id or `w_` canonical id)
	subjectIdSecondary: String # the OTHER id, on a merge/unmerge report
	subjectTitle: String # free-text title, for a series with no id yet (MISSING_WORK)
	commentId: String
	reportedUsername: String # snapshotted at submit time, so the report outlives the comment
	commentExcerpt: String # ditto — the comment is hard-deleted when moderated
	sourceUrl: String
	detail: String!
	adminNote: String
	createdAt: String!
	resolvedAt: String
}

# [komika] The report form's payload. Which optional fields are REQUIRED depends on
# `kind` (merge kinds need subjectId; MISSING_WORK needs subjectTitle; COMMENT_ABUSE needs
# commentId or reportedUsername) — the server enforces it and returns a reader-facing message.
input ReportInput {
	kind: ReportKind!
	detail: String!
	subjectId: String
	subjectIdSecondary: String
	subjectTitle: String
	commentId: String
	reportedUsername: String
	sourceUrl: String
}

type ReportPage {
	items: [Report!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int # the FILTERED count (what the pager needs)
	openCount: Int! # the GLOBAL open backlog (what the nav badge needs)
}

# [komika] What one consolidateExactDuplicates batch did.
type DuplicateSweepResult {
	merged: Int! # works merged away
	dismissed: Int! # waiting reviews closed as two different works
	queued: Int! # pairs sent to the review queue
	pending: Int! # reviews still waiting for a person
	done: Boolean! # this batch reached the end of the run
}

type MergeWorksResult {
	targetWorkId: ID! # the surviving (target) work
	movedSourceSeries: Int! # how many source_series mappings re-pointed onto the target
}

# [komika] One detachable source mapping on a work — what the admin SPLIT picker lists.
# Distinct from `WorkSource`, which says how a NATIVE client fetches a source; this is the
# admin view of the same `source_series` row, and it is the only one carrying the row's key.
type WorkSourceRow {
	id: ID! # `source_series.id` — what `splitSourceSeries` takes. NOT (sourceType, sourceKey): that pair is unique only together with sourceId (UNIQUE (source_type, source_id, source_key)), so it is ambiguous when one work carries the same manga id under two Suwayomi sources
	sourceType: String! # "mangadex" | "suwayomi"
	sourceName: String! # display name; falls back to the extension package name, then the raw source id, so the picker always has a label
	lang: String
	iconUrl: String # store-hosted extension icon (served from our origin), else the engine's; null → the UI renders an initial
	title: String! # how THIS source titles the series — the disagreement that identifies a mis-merge, and the name the detached work takes. A MangaDex mapping has no per-source title on disk, so it reports the work's
	chapterCount: Int! # chapters held from this source; they all move with it
	sourceUrl: String
}

# [komika] Result of `splitSourceSeries`. NOT an undo of MergeWorksResult — see the mutation.
type SplitSourcesResult {
	newWorkId: ID! # the freshly minted canonical work
	newReaderId: ID! # where to NAVIGATE for it: the numeric Suwayomi id unless the detached set includes a MangaDex source. `canonicalSeries` rejects a work with no MangaDex anchor, so a Suwayomi-only split must never be linked as /series/w_…
	title: String! # the new work's primary title, from the detached source's own title
	movedSources: Int! # how many source_series rows moved
}

# [komika] S2 cross-source chapter aggregation. `Series.chapterCount` on a canonical
# work now reflects the AGGREGATE (distinct chapter numbers across all sources), so a
# work whose MangaDex spine has 0 chapters but whose asurascans source has 201 reports 201.
type AggregatedChapter {
	number: Float!
	label: String! # what to print: "45", "10.5", "Oneshot" — the one server-side label rule (Phase A2)
	title: String
	firstReleasedAt: String # F12: when this chapter was FIRST released across ALL its sources (ISO-8601), or null when no source dated it. The EARLIEST source time, matching `release_event.first_seen_at`'s first-source-wins rule, so a chapter's date does not change as the reader switches translator. Deliberately NOT named `releasedAt` — the client strips unknown fields by NAME across every document, and `UpdateFeedRow.releasedAt` already exists
	readAnywhere: Boolean! # has the VIEWER read this chapter from ANY of the work's sources? DERIVED (no stored column): progress is keyed per source chapter row, so the same chapter has a different id in every source and a translator switch used to blank every marker; this is set when the viewer has a read row on any source chapter sharing this row's spine key (`chapter.chapter_key`). Named `readAnywhere`, not `read` — the client strips unknown fields by NAME across every document and `Chapter.read` is selected everywhere. False for anonymous viewers, and for oneshots/extras whose key (`x:<id>`) is source-local by construction
	sources: [ChapterSource!]! # every COPY of this chapter number: one entry per (source, scanlation group) upload, never collapsed per source — MangaDex carrying "Ch. 3" from two groups yields two entries. Deterministic order: Suwayomi sources then the mirror, oldest copy first
}

type ChapterSource {
	sourceType: String! # "mangadex" | "suwayomi"
	sourceId: String!
	suwayomiMangaId: ID # for a Suwayomi source: pass to chapters(seriesId:) to read this source's copy; null for the MangaDex mirror
	chapterId: ID! # the specific chapter to open (a Suwayomi chapter id, or a MangaDex chapter uuid)
	scanlator: String # attribution for THIS copy: MangaDex group names joined with " & ", else the uploader username (or "No Group" if unavailable); null = unknown (not backfilled yet / the source reports none)
	copyReleasedAt: String # when THIS copy was released (ISO-8601, readable_at else published_at); null when undated. Named copy… so the client's by-name stripper never touches UpdateFeedRow.releasedAt
	copyExternalUrl: String # set when THIS copy is hosted off-site (MangaPlus, Comikey…) — open it as a hand-off, not as pages
}
