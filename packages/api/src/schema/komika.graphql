// Komika unified backend — GraphQL contract (SDL).
//
// This is the schema the client in `@komika/api` codes against. The Komika server
// implements it by FEDERATING two concerns:
//   • Catalog / chapters / pages / library / progress  → sourced from a
//     Suwayomi/Tachidesk-style server (the operator curates enabled sources;
//     the catalog is auto-served, so there is NO user-facing source picking).
//   • Social / auth / discovery / adaptive-scan         → Komika's own services.
//
// Fields annotated "[suwayomi]" are proxied/derived from Suwayomi's GraphQL
// (e.g. MangaType.title/thumbnailUrl/genre/status/inLibrary, ChapterType.*,
// fetchChapterPages). Fields annotated "[komika]" are Komika-native.

schema {
	query: Query
	mutation: Mutation
}

type Query {
	# catalog
	discovery: [DiscoveryFeed!]! # [komika] curated feeds over the [suwayomi] catalog
	updates(page: Int = 1): SeriesPage! # [komika] library series the adaptive scanner found new chapters for, ordered by latestChapterAt (real upstream release time) DESC — the clock the cards display. Membership is the scanner's detection; only the ORDER is upstream's. Undated rows sort last.
	search(query: String!, page: Int = 1, genres: [String!], minRating: Float, maxRating: Float, types: [ComicType!], status: SeriesStatus, sort: BrowseSort, contentRating: ContentRatingFilter, includeNsfw: Boolean, hasChapters: Boolean, filter: BrowseFilter): SeriesPage! # [komika] Browse v2: `filter` applies TOGETHER with a text query and wins over every legacy argument; optional so an older server can be stripped of it (OPTIONAL_ARGUMENTS). S4: catalogue search + BROWSE. An EMPTY query browses the whole BROWSABLE canonical catalogue (115.6k works, from the materialized `browse_catalogue`) with every filter and sort applied in SQL, so `total`/`hasNextPage` describe the filtered set — it used to browse only the 13.8k-work Suwayomi library subset with one fixed order, then the 48.5k works that have a DATED chapter. A TEXT query runs full-text search over the canonical works instead; `types`/`status`/`sort`/`contentRating` apply to the BROWSE path only. Page size is 30 on both. `genres` matches ANY (capped at 12); `minRating`/`maxRating` filter by aggregate user rating 0–10 (minRating>0 drops unrated). `contentRating` can only NARROW within the viewer's NSFW posture, never widen past it (see ContentRatingFilter). `includeNsfw` is the ADMIN CONSOLE escape hatch: honoured only for an admin (silently ignored for anonymous + ordinary users), it ignores the admin's own show_nsfw so the console can find NSFW-flagged works — including the ~2.5k mainstream titles that are mis-flagged — and unflag them. `hasChapters` (BROWSE only) narrows to works we know a chapter for (`true`) or know none for (`false`); ABSENT means no clause, i.e. the ~67k works whose chapters MangaDex removed on licensing (Boku no Hero Academia, Nausicaä) or that will get them from a Suwayomi source are INCLUDED and sorted last on the recency ordering — hiding them hid exactly what people search for
	tags: [TagInfo!]! # [komika] Browse v2: the tag picker's vocabulary — stable slug ids, display names, MangaDex group, and a count of works carrying the tag that the viewer may see (NSFW-gated)
	browseSources(includeNsfw: Boolean): [BrowseSource!]! # [komika] the sources Browse can filter by (`BrowseFilter.source`), biggest first — "mangadex" for the mirror, else a source id; each `count` is the number of works the filter returns for the viewer (NSFW-gated), and a source with none is not offered. `includeNsfw` is the admin-console escape hatch, as on `search`
	scanlatorTags: [ScanlatorTag!]! # [komika] every scanlator an admin tagged as using AI — public, so a reader app can mark the chapter copies those names are credited on (match rule on ScanlatorTag.name)
	sourceAiTags: [SourceAiTag!]! # [komika] every source an admin tagged as using AI — public. A source that translates its own series credits no group, so the source is the scanlator. A chapter copy takes the stronger of this tag (matched on ChapterSource.sourceId, or the series' sourceId) and the tag on its scanlator credit
	genreFacets: [GenreFacet!]! # [komika] S4: the genre chips for Browse's filter, most common first then alphabetical, gated by the viewer's NSFW posture. Each `count` is now EXACTLY the number of results the same genre filter returns — it previously came from JSON-parsing 13.8k Suwayomi `genre` blobs per request (301 entries, ungated, top entry literally "Japanese") while the filter ran against the canonical catalogue, so the chip's number and its results disagreed. Empty until MangaDex tags are ingested into `work_tag`
	searchAllSources(query: String!, page: Int = 1): FederatedSearchPage! # [komika] federated multi-extension search — fans out to every installed source, dedupes to one canonical work per series with its per-source translators; NSFW-gated by the viewer's posture. REQUIRES LOGIN (persists mappings); per-user rate-limited (~20/min); errors "Not authenticated" for anonymous callers
	series(id: ID!): Series! # [suwayomi] MangaType by id
	chapters(seriesId: ID!): [Chapter!]! # [suwayomi] chapters(condition:{mangaId}) — one source's chapter list (served from the DB cache, S1)
	aggregatedChapters(workId: ID!): [AggregatedChapter!]! # [komika] S2: a canonical work's chapters aggregated across ALL sources (installed Suwayomi sources + MangaDex mirror), deduped by number, each carrying per-source availability so the reader can pick a translator
	pages(chapterId: ID!): [Page!]! # [suwayomi] fetchChapterPages -> normalized pages
	chapterOrigin(chapterId: ID!): ChapterOrigin # [komika] where a Suwayomi chapter lives at its source, for a reader app that fetches pages with its own engine; null when unknown; NSFW-gated like pages
	canonicalUpdates(page: Int = 1, includeNsfw: Boolean): [CanonicalUpdate!]! # [komika] MangaDex mirror updates, newest chapter first, NSFW-filtered (data feed). `includeNsfw` is the same admin-console-only escape hatch as on `search` — honoured for admins, ignored for everyone else
	updatesFeed(page: Int = 1, type: ComicType): UpdateFeedPage! # [komika] the reader's merged Updates feed: the union of `updates` (scanner detections on Suwayomi library series) and `canonicalUpdates` (the MangaDex mirror), taken server-side and keyed by canonical work, newest REAL upstream release first. Supersedes merging page 1 of each in the client, which could not be paginated — a page of the merged list is not page N of either feed, and the client-side title dedupe left short pages that made `total`/`hasNextPage` wrong. `type` filters by format over the WHOLE feed; NSFW-gated by the viewer's own preference (no admin escape hatch — this is a reader surface)
	# Canonical (MangaDex-mirrored) reader path — workId is the `w_`-prefixed canonical
	# id (distinct from numeric Suwayomi ids), so the reader routes it here. Returns the
	# shared Series/Chapter/Page shapes; NSFW-gated by the viewer's preference. CATALOGUE.md §6.
	canonicalSeries(workId: ID!, includeFederated: Boolean = false): Series! # [komika] a work as a Series; a work with no MangaDex anchor only with includeFederated (then sourceId is "")
	canonicalChapters(workId: ID!): [Chapter!]! # [komika] its chapters from the mirror, deduped/ordered
	canonicalPages(chapterId: ID!): [Page!]! # [komika] page URLs via MangaDex@Home (chapterId = MangaDex chapter uuid)
	# native-embedded-Suwayomi source routing — per canonical work, the source
	# mappings + extension coordinates a native client needs to fetch it directly.
	workSources(workId: ID!): [WorkSource!]! # [komika] source mappings for one canonical work
	workSourcesBatch(workIds: [ID!]!): [WorkSourceGroup!]! # [komika] source mappings grouped per work
	workSourceRows(workId: ID!): [WorkSourceRow!]! # [komika] the same mappings in ADMIN/detachable shape — each row's own `source_series` primary key, the title THAT source gives the series, and its chapter count. Feeds the split picker; `splitSourceSeries` takes the ids. Ungated by NSFW (hiding a mapping would make it silently un-detachable) — `requires isAdmin` is the access control
	# library
	library: [Series!]! # [suwayomi] mangas(condition:{inLibrary:true})
	libraryProgress: [SeriesProgress!]! # [komika] per-series read/total for every in-library series, batched — shelves the Library/Profile screens without an N+1 chapters() fan-out
	# social
	reviews(seriesId: ID!, page: Int = 1): ReviewPage! # [komika] the WORK's reviews, whichever of its ids you ask with (a `w_…` work id or any of its sources' numeric ids). ONE ROW PER AUTHOR — a reader holding a row under each id shape appears once, with their newest
	myReview(seriesId: ID!): Review # [komika] the signed-in viewer's own review for a series, regardless of pagination (null if none / signed out). Resolved through the WORK, so it is found whichever of the work's ids the caller asks with — asking with the literal id showed a viewer who HAD rated an empty star row
	comments(targetType: String!, targetId: ID!, page: Int = 1): CommentPage! # [komika] chapter thread, series discussion, or the thread of one scanlator (targetType="scanlator", targetId = RatedScanlator.id)
	# auth
	session: Session # [komika] current session or null
	instance: Instance! # [komika] public server facts (setup state, sign-up switch); no auth
	accessPreflight: AccessPreflight! # [komika] admin — connector, listener ports and public address before setup (requires isAdmin)
	accessStatus: AccessStatus! # [komika] admin — Settings › Access: access choice, address, Cloudflare setup + current run (requires isAdmin)
	myActivity(limit: Int = 20): [Activity!]! # [komika] the signed-in user's recent activity feed (empty when signed out)
	myComments(page: Int = 1): MyCommentPage! # [komika] the signed-in user's OWN comments (top-level + replies), newest first, 20 per page, each with its tallies, direct reply count and resolved series/chapter (empty page when signed out)
	notifications(page: Int = 1): [Notification!]! # [komika] the viewer's inbound bell feed, newest-first (empty when signed out)
	unreadNotificationCount: Int! # [komika] unread count for the bell badge (0 when signed out)
	# ops / admin (all require isAdmin)
	scanStatus: ScanStatus! # [komika] adaptive scan-scheduler health (admin console)
	users(page: Int = 1): AdminUserPage! # [komika] admin user-management list
	mergeQueue(page: Int = 1, limit: Int = 50): MergeQueuePage! # [komika] dedup review queue — pending mid-confidence matches, highest score first, PAGINATED (`limit` clamped to 1..=200). Was an unbounded `[MergeCandidate!]!`: the backlog is ~10.4k rows now that refused consolidation pairs land here, so clients must page (requires isAdmin)
	workReviewDetail(workId: ID!): WorkReviewDetail! # [komika] expand one side of a dedup candidate — metadata, cover, alt titles and source mappings for a single work; reads the canonical work directly so it also resolves the Suwayomi-only / NSFW works `canonicalSeries` refuses (requires isAdmin)
	coverIssues(page: Int = 1): CoverIssuePage! # [komika] admin "Bugs" panel — works whose cover the crawl could not process, most recent first; each carries the failure reason + a best-effort current cover URL (requires isAdmin)
	reports(status: ReportStatus, kind: ReportKind, page: Int = 1): ReportPage! # [komika] reader-report queue (Support → Report an issue), newest first; null status/kind mean "every value". `total` counts the FILTERED set, `openCount` is always the global open backlog (requires isAdmin)
	extensions(installedOnly: Boolean = false, lang: String, nsfw: Boolean, refresh: Boolean = false): [ExtensionInfo!]! # [komika] Mihon-format extensions from the repos the admin added (none are shipped or seeded); refresh re-fetches the repo indexes. NSFW extensions are ALWAYS listed: this is an admin management view, so the admin's reader-side show_nsfw is deliberately ignored — filter explicitly with the `nsfw` argument (requires isAdmin)
	extensionRepos: [ExtensionRepo!]! # [komika] admin — the extension repos configured on the engine, asked live (requires isAdmin)
	mangadexSetting: MangadexSetting! # [komika] admin — the MangaDex usage switch and whether the server environment pins it (requires isAdmin)
	sourceRateLimits: [SourceRateLimit!]! # [komika] admin — every per-source scan rate limit in force: the server's SCAN_SOURCE_RATE_LIMITS defaults (fromEnv) and the ones an admin set, which win (requires isAdmin)
	scanlators(search: String, ai: ScanlatorAiFilter, source: String, page: Int = 1): ScanlatorPage! # [komika] admin scanlator list — every credit chapters carry, most chapters first, 50 per page, with its AI tag. `search` matches part of the name; `ai` filters by the tag that APPLIES; `source` (a BrowseSource.id) keeps credits with chapters on that source and counts that source only. Counts come from a scan the server reuses for ten minutes; tags are always current (requires isAdmin)
	scanlatorSites: [ScanlatorSite!]! # [komika] admin site list — every source with a series in the catalogue (never "mangadex": MangaDex credits groups), biggest first, with its AI tag; a tagged source with no series left is still listed so the tag can be removed (requires isAdmin)
	scanlatorRatings(search: String, kind: ScanlatorKind, mine: Boolean, sort: ScanlatorSort, page: Int = 1): RatedScanlatorPage! # [komika] the readers' scanlator list — every site and every group with the rating this server's readers gave it, 30 per page, public. `search` matches part of the name; `mine` keeps what the viewer rated (empty when signed out); default sort TOP. A joint credit ("A & B") whose members all exist on their own is not listed: its counts go to each member
	ratedScanlator(id: ID!): RatedScanlator # [komika] one scanlator by id, null when there is none — public
	siteBlockRules: [BlockRule!]! # [komika] admin — the site-wide content block rules, in saved order (requires isAdmin)
	myBlockRules: [BlockRule!]! # [komika] the viewer's own content block rules, in saved order (requires auth)
	sources: [SourceInfo!]! # [komika] installed Suwayomi sources — the sourceBrowse picker. Every installed source is listed incl. NSFW ones, regardless of the admin's reader-side show_nsfw; each carries `isNsfw` for the UI to badge (requires isAdmin)
	sourceBrowse(sourceId: ID!, type: SourceBrowseType!, page: Int = 1, query: String): SourceBrowsePage! # [komika] browse/search one source's catalogue for bulk ingest (requires isAdmin)
	seriesSourcesBatch(seriesIds: [ID!]!): [SeriesSourceGroup!]! # [komika] catalogue provenance per Suwayomi series — linked work + source mappings, input order, ≤200 ids (requires isAdmin)
	sourceIngestJobs(active: Boolean = false): [SourceIngestJob!]! # [komika] "add all from source" ingest jobs, newest first; active:true for only running ones — poll for progress (requires isAdmin)
	seriesAdminMeta(seriesId: ID!): SeriesAdminMeta! # [komika] raw metadata-override state of a series' canonical work (pinned title/description/type/NSFW + curated tags) for the series-detail editor (requires isAdmin)
	workChaptersAdmin(workId: ID!): [AdminChapter!]! # [komika] a work's aggregated chapters WITH override state (hidden/renamed), unfiltered, for the series-detail editor (requires isAdmin)
}

type Mutation {
	mark(seriesId: ID!, marked: Boolean!): Series! # [suwayomi] updateManga inLibrary (+ [komika] scan priority)
	setLibraryStatus(seriesId: ID!, status: String): Series! # [komika] file a series under an explicit shelf (reading|completed|onhold|plan); null clears to auto-derive; adds to library if absent
	setFavorite(seriesId: ID!, favorite: Boolean!): Series! # [komika] toggle the viewer's favourite flag; adds to library if absent
	setProgress(chapterId: ID!, lastPageRead: Int!, read: Boolean!): Boolean! # [suwayomi] updateChapter
	recordView(seriesId: ID!): Boolean! # [komika] record one view (chapter open) — no auth REQUIRED, counts anonymous + ordinary signed-in readers; an admin viewer's own reads are silently skipped so admin browsing can't move Trending; the popularity signal behind Trending
	postReview(input: PostReviewInput!): Review! # [komika] upsert the viewer's review, one per (work, user). `seriesId` may be any of the work's ids; the row is FILED under the canonical work id so the rating counts on every surface that work appears on. `score` is 1..10 — to withdraw a rating use `deleteReview`, not score 0
	deleteReview(seriesId: ID!): Boolean! # [komika] withdraw the viewer's OWN rating (requires auth; scoped to the caller, so it can never touch anyone else's). `seriesId` may be any of the work's ids and the removal covers the work's WHOLE key set — `reviews.series_id` is polymorphic and historical rows keep the shape they were filed under, so deleting only the canonical id would leave a numeric-keyed row still counting. Returns false when there was nothing to remove. DESTRUCTIVE for a review that carries text: `score` is NOT NULL, so a scoreless review cannot exist and withdrawing means deleting the row
	postComment(input: PostCommentInput!): Comment! # [komika] chapter thread, series discussion, or scanlator thread
	voteComment(commentId: ID!, value: Int!): CommentVote! # [komika] like (1) / dislike (-1) / clear (0) a comment
	markNotificationsRead(ids: [ID!]): Int! # [komika] mark given (or all, if omitted) notifications read; returns count changed
	login(username: String!, password: String!): Session! # [komika]
	register(input: RegisterInput!): Session! # [komika]
	logout: Boolean! # [komika]
	createOwner(setupCode: String!, username: String!, email: String!, password: String!): Session! # [komika] first-run setup — create the first admin with the setup code from the server log; only while no admin exists; rate-limited per IP like login
	changePassword(currentPassword: String!, newPassword: String!): SessionUser! # [komika] change the viewer's own password; clears mustChangePassword and signs out their other sessions (requires auth)
	setShowNsfw(value: Boolean!): Boolean! # [komika] set the viewer's NSFW visibility preference (CATALOGUE.md §2)
	setMyBlockRules(rules: [BlockRuleInput!]!): [BlockRule!]! # [komika] replace the viewer's own content block rules (at most 50; an empty list clears them). They hide matching series from the viewer's lists (browse, search, updates, discovery), on top of the site-wide rules; a series opened by its link still opens. Returns the stored list (requires auth)
	updateProfile(input: UpdateProfileInput!): SessionUser! # [komika] update the viewer's display name + bio (avatar upload is REST: POST /avatar)
	updateSeriesAdmin(input: SeriesAdminInput!): Series! # [komika] admin "manga DB" overrides (requires isAdmin)
	triggerScan(seriesId: ID!): Series! # [komika] admin — force an immediate re-scan (requires isAdmin)
	banUser(userId: ID!, banned: Boolean!): AdminUser! # [komika] admin moderation — suspend/restore an account (requires isAdmin)
	deleteComment(commentId: ID!): Boolean! # [komika] admin moderation — remove a chapter comment (requires isAdmin)
	setUserAdmin(userId: ID!, isAdmin: Boolean!): AdminUser! # [komika] admin — grant/revoke admin (requires isAdmin)
	createUser(input: CreateUserInput!): AdminUser! # [komika] admin — create an account directly, works with sign-up closed (requires isAdmin)
	resetUserPassword(userId: ID!, password: String!): Boolean! # [komika] admin — set another account's password; revokes its sessions and sets mustChangePassword (requires isAdmin)
	setRegistrationOpen(open: Boolean!): Boolean! # [komika] admin — open/close sign-up (starts closed on a self-hosted install, open elsewhere); refused when KOMIKA_REGISTRATION_OPEN pins it (requires isAdmin)
	setMangadexEnabled(enabled: Boolean!): Boolean! # [komika] admin — turn MangaDex usage on/off, applied live; refused when KOMIKA_MANGADEX or CATALOGUE_SYNC=on pins it (requires isAdmin)
	setShowMangadexRatings(shown: Boolean!): Boolean! # [komika] admin — show/hide MangaDex's community rating next to our own readers' rating, for everyone; refused when KOMIKA_MANGADEX_RATINGS pins it (requires isAdmin)
	setSourceRateLimit(sourceId: String!, requests: Int!, windowSecs: Int!): SourceRateLimit! # [komika] admin — check a source for new chapters with at most `requests` HTTP requests per `windowSecs` (one series check costs two); adds or replaces, wins over a SCAN_SOURCE_RATE_LIMITS default, applied live (requires isAdmin)
	removeSourceRateLimit(sourceId: String!): Boolean! # [komika] admin — remove the admin's limit, applied live; the source falls back to its SCAN_SOURCE_RATE_LIMITS default when it has one; false when none was stored (requires isAdmin)
	setAccessMode(mode: String!, domain: String): AccessStatus! # [komika] admin — record the wizard's access choice ("local" | "internet" | "direct"); domain is a domain set up by hand (internet) or the public address (direct, required)
	checkCloudflareToken(token: String!, domain: String!, connection: Connection): CloudflareTokenCheck! # [komika] admin — verify a Cloudflare API token, find the zone; changes nothing, keeps no token
	startCloudflareSetup(input: CloudflareSetupInput!): AccessStatus! # [komika] admin — run the Cloudflare checklist in the background; token used for this run only
	retryCloudflareSetup(token: String!): AccessStatus! # [komika] admin — rerun the stored setup from where it failed
	removeCloudflareSetup(token: String!): AccessStatus! # [komika] admin — delete exactly what setup created, stop the connector
	addSourceSeries(suwayomiMangaId: ID!): MatchResult! # [komika] Tier-2 add flow — run the dedup matcher, wire into the canonical model (requires isAdmin)
	resolveMergeCandidate(id: ID!, accept: Boolean!): Boolean! # [komika] resolve a dedup review — accept merges, reject keeps distinct (requires isAdmin)
	mergeWorks(sourceWorkId: ID!, targetWorkId: ID!): MergeWorksResult! # [komika] D1: fold one existing canonical work into another (dedup cleanup) — source's mappings + user data re-point to target, source deleted; pick target as the enriched/MangaDex-anchored one (requires isAdmin)
	splitSourceSeries(workId: ID!, sourceSeriesIds: [ID!]!): SplitSourcesResult! # [komika] detach source mappings onto a NEW work — the fix for two different series merged together on a shared title. The counterpart to `mergeWorks`, NOT its inverse (that one deletes the losing work row and keeps no record of it). Lossless where it counts: `chapter` is keyed by `source_series_id`, so the mappings carry their whole chapter runs and nothing is deleted; reviews/library/progress/view-counts stay on the original, which has no per-source attribution to route them by. Refuses to detach the LAST source — a work with none vanishes from Browse and search (requires isAdmin)
	addExtensionRepo(indexUrl: String!): Int! # [komika] register an extension repo (store) + refresh; returns the extension count (requires isAdmin)
	removeExtensionRepo(indexUrl: String!): Boolean! # [komika] admin — remove a repo by the index URL `extensionRepos` lists; "No such repo." otherwise (requires isAdmin)
	installExtension(pkgName: String!): ExtensionInfo! # [komika] install a store extension, then record its sources' coordinates and NSFW flag in source_extension; NSFW-gated by show_nsfw (requires isAdmin)
	uninstallExtension(pkgName: String!): ExtensionInfo! # [komika] uninstall an extension (requires isAdmin)
	updateExtension(pkgName: String!): ExtensionInfo! # [komika] update an installed extension, then re-record its sources in source_extension; NSFW-gated (requires isAdmin)
	bulkAddSourceSeries(suwayomiMangaIds: [ID!]!): BulkAddResult! # [komika] bulk Tier-2 catalogue ingest, ≤100 ids; per-id failures don't abort (requires isAdmin)
	setSeriesPaused(seriesId: ID!, paused: Boolean!): Series! # [komika] targeted pause/unpause of one series' scanning; unpause re-scans immediately (requires isAdmin)
	startSourceIngest(sourceId: ID!): SourceIngestJob! # [komika] start a background "add all from source" ingest; refused if one already running or NSFW source not opted in (requires isAdmin)
	cancelSourceIngest(jobId: ID!): SourceIngestJob! # [komika] request cancellation of a running ingest job; preserves progress (requires isAdmin)
	startExtensionIngest(pkgName: ID!): [SourceIngestJob!]! # [komika] F1: start an ingest job for EVERY installed source of an extension (e.g. MangaDex's per-language sources); skips NSFW sources for opted-out admin + sources with a job already running (returns their existing job); errors only if no source matches (requires isAdmin)
	cancelExtensionIngest(pkgName: ID!): [SourceIngestJob!]! # [komika] F1: cancel all running ingest jobs for an extension's sources; returns the cancelled jobs (requires isAdmin)
	setExtensionSubscription(pkgName: ID!, subscribed: Boolean!): Boolean! # [komika] subscribe/unsubscribe an extension for background source-sync (auto-discover new series + reconcile library); enabling kicks an immediate sync pass (requires isAdmin)
	backfillMangadexMetadata(limit: Int = 200): Int! # [komika] S2 enrichment backfill — processes up to `limit` un-enriched MangaDex-anchored works (all-language alt titles/descriptions + full credits); returns count processed; call until it returns 0 to drain (requires isAdmin)
	persistCatalogue: Int! # [komika] S1 "save everything to DB" — materialize the whole Suwayomi library (metadata + chapter lists) into the DB cache so reader loads serve from SQLite; returns series persisted; prod maintenance action gated by isAdmin (no extra flag)
	materializeCatalogueCovers: Int! # [komika] S1 materialize every canonical work's cover into work_cover_blob so the web reader serves covers from /covers/{id}.webp (off the CF image Worker); polite background crawl bounded by the MangaDex limiter, single-flighted + resumable; returns works queued (still uncached) at kick-off; gated by isAdmin
	updateSeriesMetadata(input: SeriesMetadataInput!): Series! # [komika] admin series-detail editor — edit a work's title/description/type/NSFW/tags as an override layer (source data stays immutable); returns the recomputed series (requires isAdmin)
	rescanWork(workId: ID!): Int! # [komika] admin — force an immediate re-scan of EVERY installed Suwayomi source of a canonical work; returns how many sources were scanned (requires isAdmin)
	setChapterOverride(input: ChapterOverrideInput!): Boolean! # [komika] admin series-detail editor — soft-hide (reversible) or rename one chapter of a work by aggregate number; non-destructive (requires isAdmin)
	addSeriesAltTitle(id: ID!, title: String!): Series! # [komika] admin series-detail editor — add an alternative title to a work's alias index. May trigger an auto-merge of works sharing the normalized alias and at least 90% similar author names (≤8 of them) into the richest survivor, so the returned Series can be a DIFFERENT work than the one edited (requires isAdmin)
	removeSeriesAltTitle(id: ID!, title: String!): Series! # [komika] admin series-detail editor — drop one alternative title from a work's alias index (requires isAdmin)
	consolidateExactDuplicates(limit: Int = 100): DuplicateSweepResult! # [komika] admin duplicate sweep, one resumable batch: sorts up to `limit` waiting reviews, then up to `limit` groups of works sharing a title or alt title (articles ignored). Each pair is merged on evidence, closed as two different works, or left in mergeQueue with a score. `done` marks the end of a run. Single-flighted against reconcileCatalogue (requires isAdmin)
	reconcileCatalogue: Int! # [komika] admin — background pass matching every provisional (Suwayomi-only) work against the MangaDex spine; merges confident matches, queues mid-confidence ones for review. Returns the pending count at kickoff, not the result. Single-flighted (requires isAdmin)
	resyncCatalogue: Boolean! # [komika] admin — force a full catalogue re-seed: clears the catalogue/chapters sync cursors so the next cycle walks the whole createdAt history, and kicks one cycle in the background. Refused while any sync cycle is running (requires isAdmin)
	setScanlatorAi(name: String!, ai: ScanlatorAi): Boolean! # [komika] admin — tag a scanlator as using AI (AI) or partly using it (PARTIAL); `ai: null` removes the tag. Kept by name, case-folded; applies to every chapter credited to the name on every source, now and later. false when nothing changed (requires isAdmin)
	setSourceAi(sourceId: String!, ai: ScanlatorAi): Boolean! # [komika] admin — tag a whole source as using AI (AI) or partly using it (PARTIAL); `ai: null` removes the tag. Applies to every chapter copy read from the source, now and later. Not for "mangadex". false when nothing changed (requires isAdmin)
	rateScanlator(id: ID!, score: Int): RatedScanlator! # [komika] set or change the viewer's rating of a scanlator (1..10); `score: null` removes it. Resolves to the scanlator with its new numbers (requires auth)
	setSiteBlockRules(rules: [BlockRuleInput!]!): [BlockRule!]! # [komika] admin — replace the site-wide content block rules (at most 50; an empty list clears them). They apply to every viewer, signed in or not: a matching series is left out of every list and cannot be opened or read. Returns the stored list (requires isAdmin)
	markSourceNsfw(sourceId: String!, isNsfw: Boolean!): Int! # [komika] admin — flag/unflag a whole Suwayomi source as adult and re-derive the NSFW flag of every work ingested from it; the flag is remembered (source_nsfw_pin), so a series ingested LATER from that source is stored adult too; returns works changed (requires isAdmin)
	rederiveSuwayomiNsfw: Int! # [komika] admin — recompute the DERIVED is_nsfw for every Suwayomi-ingested work under the current rule (adult genre OR adult source, unless MangaDex rated it safe/suggestive). Conservative: only flips 0 -> 1, never un-flags, and leaves isNsfwOverride alone. Returns works flipped (requires isAdmin)
	retryCover(workId: ID!): Boolean! # [komika] admin "Bugs" panel — clear a work's cover-issue skip marker and re-attempt the cover fetch/encode (requires isAdmin)
	submitReport(input: ReportInput!): Report! # [komika] file a reader report (Support → Report an issue). NO AUTH REQUIRED by design — most catalogue-accuracy reports come from signed-out readers — so it is rate-limited per IP, length-caps every field, enforces the per-kind required fields, requires `subjectId` to name a series we know, and snapshots the reported comment's author/body (the comment may later be hard-deleted)
	resolveReport(reportId: ID!, status: ReportStatus!, note: String): Report! # [komika] triage a reader report — resolve/reject, or reopen (which clears the resolution stamp); `note` is merged, not cleared, when null (requires isAdmin)
}

enum ComicType {
	MANGA
	MANHWA
	MANHUA
	WEBTOON
	COMIC
}

# Maps from Suwayomi MangaStatus: UNKNOWN, ONGOING, COMPLETED, LICENSED,
# PUBLISHING_FINISHED, CANCELLED, ON_HIATUS.
enum SeriesStatus {
	ONGOING
	COMPLETED
	HIATUS
	CANCELLED
	UNKNOWN
}

# How Browse (`search` with an empty query) orders the catalogue. TRENDING is the
# default — the only ordering that reflects what people are actually reading — and it
# degrades to NEWEST for everything with no views in the last 24h, so a cold view
# table cannot render Browse empty. RATING likewise puts rated works first and falls
# through to NEWEST for the unrated. LATEST_ADDED uses the work's catalogue-add time,
# with work identity breaking ties.
enum BrowseSort {
	TRENDING # most-viewed over the last 24h first, then newest release
	NEWEST # newest upstream chapter release first
	LATEST_ADDED # works most recently added to the catalogue first
	RATING # highest user-review average first, then newest for the unrated
	CHAPTERS # most English chapters first (the same number `chapterCount` reports)
}

# The content-rating ceiling Browse filters by. CUMULATIVE: each value admits
# everything the milder ones do (SAFE ⊂ SUGGESTIVE ⊂ EROTICA ⊂ PORNOGRAPHIC), and ALL
# applies no rating clause at all. NSFW_ONLY is the sole exception — see below.
#
# THE VIEWER'S NSFW GATE DOMINATES THIS. The filter can only narrow within what the
# viewer's `show_nsfw` already allows — it never widens past it. Concretely: no
# NSFW-cleared work carries `erotica` or `pornographic`, so for an opted-out viewer
# EROTICA and PORNOGRAPHIC return exactly the SUGGESTIVE set rather than revealing
# anything. Asking for a spicier tier is not a way to opt in.
enum ContentRatingFilter {
	ALL
	SAFE
	SUGGESTIVE
	EROTICA
	PORNOGRAPHIC # admits every stored rating, i.e. equivalent to ALL
	# Adult-rated works ONLY — the complement of SAFE, not a ceiling above it, and the
	# only non-cumulative member. Exists because "show me just the adult titles" cannot
	# be said with a tier (every tier admits `safe`); it is the other half of the control
	# that replaced Browse's NSFW toggle. Filters the materialized `is_nsfw` flag, so it
	# follows admin overrides rather than contradicting them. For an opted-out viewer it
	# returns an EMPTY page — the honest answer — rather than degrading to "everything".
	NSFW_ONLY
}

# --- Browse v2 (`search(filter:)` + `tags`) ---------------------------------------
enum TagMode {
	AND
	OR
}
enum SortDirection {
	ASC
	DESC
}
enum BrowseSortField {
	RELEVANCE # text query only; without a query the server falls back to LATEST_UPDATE
	LATEST_UPDATE # newest chapter release
	RECENTLY_ADDED # work created_at
	MOST_VIEWED # our own view counts
	MOST_FOLLOWS # MangaDex follows
	HIGHEST_RATED # MangaDex bayesian rating
	READER_RATED # our own readers' review average (the v1 RATING); unrated works last
	MOST_CHAPTERS # en chapter count
	TITLE # A-Z (ASC default for this one)
	YEAR # publication year
}
enum Demographic {
	SHOUNEN
	SHOUJO
	SEINEN
	JOSEI
	NONE
}
# A rating as a CATEGORY, not a ceiling (cf. ContentRatingFilter). Narrows INSIDE the
# viewer's NSFW gate, never widens it.
enum ContentRating {
	SAFE
	SUGGESTIVE
	EROTICA
	PORNOGRAPHIC
}
enum TagGroup {
	GENRE
	THEME
	FORMAT
	CONTENT
}
input BrowseFilter {
	includedTags: [String!] # TagInfo.id, max 32
	includedTagsMode: TagMode # default AND
	excludedTags: [String!] # max 32
	excludedTagsMode: TagMode # default OR
	status: [SeriesStatus!]
	types: [ComicType!] # OR; WEBTOON->MANHWA, COMIC->MANGA
	demographics: [Demographic!]
	contentRatings: [ContentRating!]
	originalLanguages: [String!] # "ja","ko","zh","zh-hk","en",... max 16
	yearFrom: Int # clamped 1900..=2100
	yearTo: Int
	minChapters: Int
	minRating: Float # MangaDex bayesian 0..10
	minFollows: Int
	hasChapters: Boolean # true = only works with a readable chapter
	source: String # a BrowseSource.id: "mangadex", or a Suwayomi source id ("suwayomi" = any Suwayomi source)
	sort: BrowseSortField # default RELEVANCE with a query, LATEST_UPDATE without
	direction: SortDirection # default DESC (TITLE: ASC)
}
# [komika] One source Browse can filter by.
type BrowseSource {
	id: String! # what BrowseFilter.source takes: "mangadex", or a Suwayomi source id
	name: String! # display name; the extension package name, then the id, when the engine did not answer
	lang: String # "en", "all", …; null for the MangaDex mirror
	count: Int! # works from this source the viewer may see in Browse
}
# [komika] What an admin says about a scanlator's use of AI.
enum ScanlatorAi {
	AI # the translation is machine made
	PARTIAL # AI is part of the work (for example machine translation that a person edits)
}
enum ScanlatorAiFilter {
	TAGGED # AI or PARTIAL
	AI
	PARTIAL
	UNTAGGED
}
type ScanlatorTag {
	name: String! # the credit as tagged. Match to Chapter.scanlator / ChapterSource.scanlator trimmed and case-folded; a joint credit ("A & B") with no tag of its own takes the strongest tag of its members (AI over PARTIAL)
	ai: ScanlatorAi!
}
# [komika] One row of the admin scanlator list.
type Scanlator {
	name: String! # the credit as chapters carry it
	chapterCount: Int! # chapter copies credited to the name (on the filtered source, when one is given)
	seriesCount: Int!
	ai: ScanlatorAi # the tag stored for exactly this name
	effectiveAi: ScanlatorAi # the tag that applies: `ai`, else one a joint credit takes from a member
}
# [komika] One tagged source.
type SourceAiTag {
	sourceId: String! # a Suwayomi source id; match to ChapterSource.sourceId
	ai: ScanlatorAi!
}
# [komika] One row of the admin site list: a source, as a scanlator of its own.
type ScanlatorSite {
	sourceId: String!
	name: String! # display name; the extension package name, then the id, when the engine did not answer
	lang: String
	seriesCount: Int! # series in the catalogue that have this source
	ai: ScanlatorAi # the tag stored for the source
}
# [komika] A scanlator is a site that translates its own series, or a group that chapters credit. MangaDex is not a site: its groups are the scanlators.
enum ScanlatorKind {
	SITE
	GROUP
}
enum ScanlatorSort {
	TOP # ranked scanlators by rank, then the rest by number of ratings
	VOTES
	CHAPTERS
	NAME
}
# [komika] One row of the readers' scanlator list.
type RatedScanlator {
	id: ID! # "site:<source id>" or "group:<name key>"; also the targetId of its comment thread (targetType="scanlator")
	kind: ScanlatorKind!
	name: String!
	lang: String # sites only
	seriesCount: Int!
	chapterCount: Int # null for a site: the server has no cheap count
	ai: ScanlatorAi # the tag that applies
	rating: Float # plain average of the scores, null when nobody rated it
	ratingCount: Int!
	rank: Int # 1-based and global, by a score weighted toward the server mean; null below 5 ratings
	distribution: [Int!]! # ten numbers: how many readers gave 1, 2, … 10
	myScore: Int # the viewer's own score; null when signed out or not rated
	commentCount: Int! # readable comments at any depth
}
type RatedScanlatorPage {
	items: [RatedScanlator!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int!
}
# [komika] One content block rule. It matches a series that carries ALL of `tags` and, when `ratings` is not empty, has ONE of them (the EFFECTIVE rating: a series the NSFW gate treats as adult is never below EROTICA, one with no rating is SAFE). A series is blocked when any rule matches.
type BlockRule {
	tags: [String!]! # tag ids (TagInfo.id), sorted
	ratings: [ContentRating!]! # mildest first; empty = any rating
}
input BlockRuleInput {
	tags: [String!] # at most 8; unknown ids are refused only when they are not [a-z0-9-]
	ratings: [ContentRating!] # a rule needs a tag or a rating; all four ratings with no tag is refused
}
type ScanlatorPage {
	items: [Scanlator!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int! # the FILTERED count
}
type TagInfo {
	id: String! # URL-safe slug of the canonical English name: "action", "boys-love"
	name: String!
	group: TagGroup!
	count: Int!
}

type Series {
	metadata: SeriesMetadata
	id: ID!
	title: String!
	altTitles: [String!]!
	author: String
	artist: String
	description: String
	genres: [String!]!
	type: ComicType! # [komika] classified per source region
	status: SeriesStatus!
	coverUrl: String! # [suwayomi] thumbnailUrl (client resolves via ImageProvider)
	sourceId: String!
	chapterCount: Int!
	isMarked: Boolean! # [suwayomi] inLibrary
	libraryStatus: String # [komika] per-viewer explicit shelf (reading|completed|onhold|plan); null = auto-derive from progress
	isFavorite: Boolean! # [komika] per-viewer favourite flag
	isNsfw: Boolean! # [komika] canonical NSFW flag; false until catalogued (drives showNsfw filtering)
	rating: RatingSummary! # [komika] the WORK's aggregate, not this id's. `reviews.series_id` holds whichever id the reader was addressing when they rated (a `w_…` work id from the canonical page, the numeric id of a source otherwise), so every rating reader resolves the id onto its work before aggregating — asking with the literal id is what made a work print a rating on one surface and "0 users rated" on another
	mangadexRating: Float # [komika] MangaDex's community rating of the work, 0-10 (statistics cache, `work_stats`); `rating` above is ALWAYS our own readers'. Null when MangaDex has none or the admin turned MangaDex ratings off (Instance.showMangadexRatings)
	scan: ScanPolicy! # [komika] adaptive-scan config (admin-overridable)
	createdAt: String!
	updatedAt: String! # [komika] last metadata touch — NOT chapter recency; moves on every poll. Use latestChapterAt for "recently updated".
	latestChapterAt: String! # [komika] real newest-chapter time (ISO); empty when no dated chapter cached. The field feeds/cards should sort and label by.
	detectedAt: String # [komika] when WE detected that newest chapter (discovery time) — the third clock, distinct from updatedAt (poll touch) and latestChapterAt (upstream publish). Decides Updates-feed MEMBERSHIP but does NOT order it. Always carries a UTC offset, so Date.parse can't read it as local time. Selected opportunistically: see OPTIONAL_SERIES_FIELDS in operations.ts, the client drops it against a server that predates it.
	latestChapter: String # [komika] the newest chapter's LABEL — "151", "10.5", "Oneshot" (migration 0095). NOT chapterCount: that is how MANY chapters we know of, this is what the newest one is CALLED, and a series with 12 mirrored chapters whose newest is Ch. 151 is ordinary. Rendering the count under a "Ch." label is F4, the bug the chapter-number contract exists to prevent — so null means PRINT THE COUNT ALONE, never fall back to chapterCount. Populated on the browse/catalogue path only (browse_catalogue.latest_chapter); null on the Suwayomi-live and canonical-detail paths, which hold no label. Selected opportunistically: see OPTIONAL_SERIES_FIELDS in operations.ts.
	views: SeriesViews! # [komika] per-series view (chapter-read) counts — the popularity signal; resolver field, selected only by the series-detail queries
	workId: ID # [komika] the canonical work this series belongs to (null when uncatalogued). Lets the reader get from a numeric Suwayomi id to the work whose SIBLING source mappings the source picker must offer. Resolver field — one query per series, so like `views` it is selected only by the single-series detail query, never by the shared SeriesFields fragment (per-card N+1)
	# [komika] S2/F2 enrichment (resolver fields — opt-in; empty for non-canonical/un-enriched works). `id` must be a canonical work id (w_…).
	localizedDescriptions: [LocalizedDescription!]! # every-language MangaDex descriptions (singular `description` stays the English-preferred primary)
	credits: [Credit!]! # full author/artist list (singular `author`/`artist` keep only the first of each)
	covers: [Cover!]! # F2: full per-volume/per-locale cover set, primary first; `coverUrl` remains the single primary. Populated by enrichment/backfill; empty until then
}

type SeriesViews {
	total: Int! # all-time views
	last7d: Int! # views in the last 7 days
	last24h: Int! # views in the last 24 hours
}

type LocalizedDescription {
	lang: String!
	description: String!
}

type SeriesMetadata {
	year: Int
	originalLanguage: String
	demographic: String
	contentRating: String
	tags: [MetadataTag!]!
	trackers: [TrackerLink!]!
}
type MetadataTag { id: String, name: String!, group: String! }
type TrackerLink { provider: String!, externalId: String!, url: String! }

type Credit {
	role: String! # "author" | "artist"
	name: String!
}

type Cover {
	fileName: String! # covers/{mangadexId}/{fileName} leaf
	url: String! # proxy-ready full cover URL (client resolves via ImageProvider)
	thumbnailUrl: String! # proxy-ready 512px thumbnail URL
	lang: String # cover locale (e.g. "ja")
	volume: String # volume label (e.g. "1")
	isPrimary: Boolean! # the main cover mirrored on Series.coverUrl
}

# [komika] Per-WORK review aggregate. ONE VOTE PER USER: a reader can hold more than one
# `reviews` row for a work (historical rows keep the id shape they were filed under, and
# those are deliberately not rewritten), and only their newest score counts — so `count` is
# the number of PEOPLE who rated, never the number of rows.
type RatingSummary {
	average: Float!
	count: Int!
	distribution: [Int!]! # length 10; index 0 => score 1
}

type GenreFacet { # [komika] S4 search filter facet
	genre: String!
	count: Int! # cached series carrying this genre
}

type ScanPolicy {
	avgIntervalHours: Float! # rolling average between chapters
	overrideIntervalHours: Float # admin override (manga DB console)
	pollEveryMinutes: Int!
	paused: Boolean! # effective (folded) paused state
	# Raw admin overrides so the console can tell an explicit choice apart from
	# the status default even when they coincide. null => no override.
	statusOverride: SeriesStatus
	pausedOverride: Boolean
	# Raw admin poll-interval override (minutes). null => no override, so the
	# effective pollEveryMinutes above is the folded default.
	pollEveryMinutesOverride: Int
	lastScannedAt: String
	nextScanAt: String
}

type Chapter {
	id: ID!
	seriesId: ID!
	# The chapter's number, or 0 when it has none. PREFER `label`: a oneshot arrives here
	# as a hard-coded 0 with no way to tell it from a real Chapter 0, which is why the
	# reader printed "Chapter 0" for 21,422 works (F2).
	number: Float!
	# What to print: "45", "10.5", "Oneshot". The one labelling rule, server-side.
	label: String!
	# Set when the chapter is hosted off-site (MangaPlus, Comikey, NamiComi, BiliBili —
	# ~35,000 chapters, 4% of the mirror) and has no pages for us to serve. The reader must
	# send the user here instead of asking for pages it will never get.
	# `externalUrl != null` is the ONLY valid test — `pageCount == 0` is NOT: this server
	# returns pageCount 0 for ordinary chapters too (verified live 2026-07-30).
	externalUrl: String
	title: String
	pageCount: Int!
	uploadedAt: String # when the SOURCE says the chapter became readable
	# When WE first recorded it as available (`release_event.announce_at`, migration 0099),
	# joined on (work_id, chapter_key) so it follows the chapter across a translator switch.
	# NULL means WE DO NOT KNOW and MUST render as "—" — never as `uploadedAt`. Falling back
	# would assert we found the chapter the instant it was published, which is the precise
	# claim this field exists to stop the UI making. Expect null for essentially every
	# chapter predating 0099: there is no record of when those were first seen, and none was
	# invented.
	foundAt: String
	scanlator: String
	read: Boolean! # [suwayomi] isRead
	lastPageRead: Int!
	bookmarked: Boolean! # [suwayomi] isBookmarked
	isDownloaded: Boolean!
}

# Per-series read progress for the whole library, returned by `libraryProgress`
# in one batched query. `read` and `total` count the same population (distinct
# chapters across the series' sources), so `read <= total` always holds.
type SeriesProgress {
	id: ID! # [komika] library series id — a canonical `w_` work id or a numeric Suwayomi id (matches Series.id)
	read: Int! # distinct chapters read, deduped across sources and across both progress stores
	total: Int! # distinct chapters that exist; 0 only when none are cached — the client reads it as `total || series.chapterCount`
	lastReadAt: String # RFC 3339, or null. MAX(updated_at) over the viewer's progress rows, so it
	# moves on ANY progress, not just finishing a chapter. Orders the Profile's
	# Continue-reading shelf and the Library's "Recently read" sort.
}

# Upstream image URL; never used directly as <img src> — the client's
# ImageProvider proxies it via the Cloudflare Worker (web) or fetches it in
# Rust (native).
type Page {
	index: Int!
	sourceUrl: String!
	width: Int
	height: Int
}

enum DiscoveryFeedKind {
	POPULAR
	TRENDING
	RECENTLY_UPDATED
	RECENTLY_ADDED
	GENRE
}

type DiscoveryFeed {
	kind: DiscoveryFeedKind!
	title: String!
	genre: String
	items: [Series!]!
}

type UserRef {
	id: ID!
	username: String!
	avatarUrl: String
}

type Review {
	id: ID!
	seriesId: ID! # the id the review is FILED under — the canonical work id for anything posted since ratings were made per-work, but older rows keep the numeric source id they were written with. NOT necessarily the id you queried by; treat it as opaque
	author: UserRef!
	score: Int! # 1..10
	body: String!
	hasSpoiler: Boolean!
	createdAt: String!
	updatedAt: String!
}

# A comment on a polymorphic target: a chapter thread (targetType="chapter") or a
# series-level discussion (targetType="series"). Distinct from Review (scored, one/user).
type Comment {
	id: ID!
	targetType: String! # "chapter" | "series" | "scanlator"
	targetId: ID!
	parentId: ID # [komika] reply parent; null = top-level comment (arbitrary-depth trees)
	author: UserRef!
	body: String!
	hasSpoiler: Boolean!
	mediaUrl: String # [komika] attached image path (/comment-media/<id>.webp), if any
	mediaWidth: Int # [komika] attached image dimensions (reserve layout space)
	mediaHeight: Int
	createdAt: String!
	likes: Int! # [komika] like tally
	dislikes: Int! # [komika] dislike tally
	myVote: Int! # [komika] the viewer's own vote: 1 like, -1 dislike, 0 none
}

# [komika] One of the viewer's own comments (the profile's "My comments" list). The owning
# series is resolved server-side (a chapter thread's series, as on Notification) along with
# its title and the chapter number, so a row renders and deep-links without a lookup.
type MyComment {
	id: ID!
	targetType: String! # "chapter" | "series" | "scanlator"
	targetId: ID!
	parentId: ID # reply parent; null = top-level comment
	body: String!
	hasSpoiler: Boolean!
	createdAt: String!
	likes: Int!
	dislikes: Int!
	replyCount: Int! # direct replies (banned authors excluded)
	seriesId: ID # owning series; null when unresolvable
	seriesTitle: String
	chapterNumber: String # chapter threads only, e.g. "12" / "10.5"
}

type MyCommentPage {
	items: [MyComment!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

# [komika] Result of voteComment — a comment's fresh tallies + the viewer's vote.
type CommentVote {
	likes: Int!
	dislikes: Int!
	myVote: Int!
}

# [komika] One inbound notification (the bell feed). `actor` is null for an aggregate
# like_milestone; `commentExcerpt` snippets the viewer's own comment; target* deep-links.
type Notification {
	id: ID!
	kind: String! # 'reply' | 'like_milestone'
	actor: UserRef
	commentId: ID
	commentExcerpt: String
	targetType: String
	targetId: ID
	seriesId: ID # [komika] owning series for a chapter target — deep-links to /read/<seriesId>?ch=<targetId>
	count: Int # milestone value for like_milestone
	createdAt: String!
	read: Boolean!
}

type Session {
	token: String!
	user: SessionUser!
}

type SessionUser {
	id: ID!
	username: String!
	displayName: String # [komika] editable display name; falls back to username
	bio: String # [komika] editable "about me" text
	avatarUrl: String
	isAdmin: Boolean!
	showNsfw: Boolean! # [komika] viewer's NSFW visibility preference (CATALOGUE.md §2)
	joinedAt: String! # [komika] account creation timestamp (profile "joined" date)
	mustChangePassword: Boolean! # [komika] set by createUser/resetUserPassword; cleared by changePassword. While true the account can only read `session`, call `changePassword` and `logout`; everything else treats it as signed out
}

# Public server facts (`instance` query). Settings resolve env → admin setting → default.
type Instance {
	setupRequired: Boolean! # true while no admin account exists
	name: String!
	version: String!
	registrationOpen: Boolean!
	mangadexEnabled: Boolean!
	showMangadexRatings: Boolean! # false: the admin turned MangaDex ratings off, so no `mangadexRating` is ever returned and the reader hides its own switch
	appsFetchThemselves: Boolean! # true: reader apps fetch chapter pages from the sources themselves; an app with its own engine does not offer fetching through this server
}

# Self-host access (admin). The Cloudflare API token is never stored or returned.
enum Connection {
	TUNNEL
	PUBLIC_IP
}

input CloudflareSetupInput {
	token: String!
	domain: String!
	connection: Connection!
	publicIp: String # public IP only; empty detects the server's address
}

type CloudflareTokenCheck {
	zoneName: String!
	zoneStatus: String!
	accountName: String!
	missing: [String!]! # permission rows refused by read probes; cannot prove Edit access
}

type CloudflareStep {
	id: String!
	label: String!
	state: String! # "waiting" | "running" | "done" | "failed"
	message: String
}

type CloudflareJob {
	kind: String! # "setup" | "remove"
	running: Boolean!
	failed: Boolean!
	steps: [CloudflareStep!]!
}

type CloudflareSetup {
	domain: String!
	connection: Connection
	zoneName: String
	complete: Boolean!
	removable: Boolean! # anything left for removeCloudflareSetup
}

type AccessPreflight {
	cloudflared: String! # "found" | "download" | "unsupported"
	cloudflaredDetail: String # path when found; what to do when unsupported
	httpPort: Int! # the plain HTTP port as other machines see it (KOMIKA_PUBLISHED_PORT in a container)
	httpsPort: Int!
	httpsPortState: String! # "free" | "serving" | "in_use" | "denied"; "unknown" for other OS errors
	acmePort: Int!
	acmePortState: String! # same states as httpsPortState
	inContainer: Boolean! # the host must also publish the ports
