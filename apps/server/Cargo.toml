[package]
name = "komika-server"
version = "0.1.0"
edition = "2021"
description = "Komika unified GraphQL API — federates Suwayomi + Komika-native social/auth/discovery."
license = "AGPL-3.0-only"

[[bin]]
name = "komika-server"
path = "src/main.rs"

[lints.clippy]
# HTTP helpers return `Result<_, axum::response::Response>` so a handler can `?` its
# refusal straight out; boxing that Response would only add an allocation per request.
result_large_err = "allow"

[dependencies]
# `process` + `io-util`: the self-host Cloudflare connector runs `cloudflared` as a
# supervised child and reads its log lines (cloudflare/connector.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "io-util"] }
axum = { version = "0.8", features = ["multipart"] }
# Preserve data/trailer frames while metering the fallback listener's encoded body.
http-body = "1"
async-graphql = "7"
async-graphql-axum = "7"
tower = "0.5"
# `fs` serves the optional self-host web folder (`KOMIKA_WEB_DIR`, see `web_dir.rs`).
# `limit` caps the body of `POST /graphql` (main.rs): async-graphql reads the raw body,
# past axum's own `DefaultBodyLimit`.
tower-http = { version = "0.6", features = ["cors", "trace", "set-header", "catch-panic", "request-id", "compression-gzip", "fs", "limit"] }
async-trait = "0.1"
# Stream combinators (buffer_unordered) for bounded-concurrency background crawls
# (cover.rs). Only the façade over futures-util, already vendored transitively.
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Cover perceptual-hash (dedup signal, CATALOGUE.md §4) + user avatar processing
# (apps/server/src/avatar.rs): decode JPEG/PNG/WebP uploads and re-encode avatars
# as lossless WebP (pure-Rust — no libwebp/C dependency). Only the codecs we use,
# to keep the dependency surface + binary small.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Lossy WebP ENCODE for covers (image-webp is lossless-only). The `webp` crate wraps
# libwebp, which libwebp-sys2 builds from bundled C sources via cc — no system libwebp
# needed. Covers use this to hit the ~150 KB budget while staying sharp at 512px;
# avatars/comment images stay on the pure-Rust lossless path.
webp = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
# Session tokens are hashed at rest (SHA-256 hex) so a leaked DB snapshot doesn't
# expose usable bearer tokens (defense-in-depth). Already vendored transitively.
sha2 = "0.10"
# The pinned macOS cloudflared release is gzip-compressed (already locked).
flate2 = "1"
# Insertion-ordered map for the bounded page fingerprint notes (page_locator.rs).
# Already in the tree through sqlx's statement cache.
hashlink = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
# Self-host Cloudflare "public IP" mode (cloudflare/origin_tls.rs): the server serves HTTPS
# with a Cloudflare Origin CA certificate. All three crates are already in the tree through
# reqwest's rustls stack (same versions, ring backend), so nothing new is built: `ring`
# makes the P-256 key and signs the certificate request, `tokio-rustls` terminates TLS,
# `base64` writes the request as PEM. Nothing here runs unless an admin sets it up.
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
base64 = "0.22"
# `komika-server setup` (setup_cli.rs) reads the owner password and the Cloudflare token
# from the terminal without echoing them.
rpassword = "7"

# `process`: the server raises its open-file soft limit at start (`raise_open_file_limit`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# `unwind` (not `abort`) so the tower_http CatchPanic layer can turn a panicking
# resolver into a 500 instead of taking down the whole worker process.
panic = "unwind"

[dev-dependencies]
# `test-util` unlocks paused/advanced time so TTL tests are deterministic, not timed.
tokio = { version = "1", features = ["test-util"] }
