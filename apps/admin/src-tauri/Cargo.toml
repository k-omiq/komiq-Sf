[package]
name = "komiq-desktop"
version = "0.1.0"
description = "komiq desktop app: runs the komiq server and its source engine on this computer"
authors = ["you"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.78"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Same Tauri line as the reader's shell (apps/reader/src-tauri); Cargo.lock started as
# a copy of the reader's so both apps resolve identical versions.
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# The engine supervisor shared with the reader (src/lib.rs `mod suwayomi`) logs through
# `log`; src/logbuf.rs installs the logger that keeps those lines for the log view.
log = "0.4"
tauri = { version = "2.11.3", features = [] }
# Used by the shared engine supervisor (readiness poll) and by src/local.rs (`/health`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Child processes (engine, server), their output pumps, timers.
tokio = { version = "1", features = ["net", "process", "time", "sync", "rt", "macros", "io-util"] }
# The reader's on-device Cloudflare shim (src/lib.rs `mod cloudflare`) listens with it;
# same version as the reader.
tiny_http = "0.12"

# src/child.rs: `prctl(PR_SET_PDEATHSIG)` so the server and engine end with the app.
# Already in the tree (tokio, gtk-rs, …); this names the same 0.2 line directly.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# src/child.rs: a Job Object that ends the server and engine with the app. The same
# 0.61 line tokio uses on Windows, plus the three API groups the job calls need.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "process", "time", "sync", "rt", "macros", "io-util", "rt-multi-thread"] }
