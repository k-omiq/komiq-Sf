# Disposable database rehearsal only. Use ONLY through rehearsal.sh.
# safety.py pins this file's SHA-256 and compares the rendered configuration
# with an exact contract: any change here needs the matching change there.
# No build, ports, bind mounts, host namespaces or extra networks may be added.
name: ${KOMIKA_REHEARSAL_PROJECT:?set a unique rehearsal project other than komika}
services:
  postgres:
    container_name: ${KOMIKA_REHEARSAL_PROJECT:?set rehearsal project}-postgres
    labels: &labels
      cc.komiq.rehearsal: ${KOMIKA_REHEARSAL_PROJECT:?set rehearsal project}
    image: komika-postgres:18.6-pgbackrest-2.59
    init: true
    restart: 'no'
    stop_grace_period: 240s
    mem_limit: ${KOMIKA_REHEARSAL_PG_MEMORY:-3g}
    memswap_limit: ${KOMIKA_REHEARSAL_PG_MEMORY:-3g}
    cpus: ${KOMIKA_REHEARSAL_PG_CPUS:-1}
    pids_limit: ${KOMIKA_REHEARSAL_PG_PIDS:-256}
    shm_size: ${KOMIKA_REHEARSAL_PG_SHM:-1g}
    logging: &logs
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    environment: &environment
      PGDATA: /var/lib/postgresql/18/docker
      KOMIKA_POSTGRES_PASSWORD: ${KOMIKA_POSTGRES_PASSWORD:?set password in rehearsal env file}
      KOMIKA_PG_INIT_NEW: ${KOMIKA_PG_INIT_NEW:-0}
      KOMIKA_REHEARSAL_PROJECT: ${KOMIKA_REHEARSAL_PROJECT:?set a unique rehearsal project other than komika}
      # 1 = local proof without any repository; the image then refuses every R2 value.
      KOMIKA_REHEARSAL_NO_REPO: ${KOMIKA_REHEARSAL_NO_REPO:-0}
      KOMIKA_PG_ALLOWED_CIDRS: 172.30.21.0/24
      # rehearsal.sh requires all six below unless NO_REPO=1; the image checks again.
      KOMIKA_R2_ENDPOINT: ${KOMIKA_R2_ENDPOINT:-}
      KOMIKA_R2_BUCKET: ${KOMIKA_R2_BUCKET:-}
      KOMIKA_R2_PREFIX: ${KOMIKA_R2_PREFIX:-}
      KOMIKA_PRODUCTION_R2_PREFIX: ${KOMIKA_PRODUCTION_R2_PREFIX:-}
      KOMIKA_R2_KEY: ${KOMIKA_R2_KEY:-}
      KOMIKA_R2_SECRET: ${KOMIKA_R2_SECRET:-}
      # 0 only for a `*-local` project against a private literal address; rehearsal.sh
      # and the image both refuse it anywhere else. 1 = verify TLS (always on R2).
      KOMIKA_R2_VERIFY_TLS: ${KOMIKA_R2_VERIFY_TLS:-1}
    volumes: &volumes
      - postgres-data:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
    tmpfs: &tmpfs
      - /run/komika:mode=0700
    networks: [rehearsal]
    healthcheck:
      test: ['CMD', '/opt/komika-postgres/health.sh']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s
  postgres-backup:
    container_name: ${KOMIKA_REHEARSAL_PROJECT:?set rehearsal project}-postgres-backup
    labels: *labels
    image: komika-postgres:18.6-pgbackrest-2.59
    command: [scheduler]
    init: true
    restart: 'no'
    stop_grace_period: 240s
    mem_limit: ${KOMIKA_REHEARSAL_BACKUP_MEMORY:-512m}
    memswap_limit: ${KOMIKA_REHEARSAL_BACKUP_MEMORY:-512m}
    cpus: ${KOMIKA_REHEARSAL_BACKUP_CPUS:-1}
    pids_limit: ${KOMIKA_REHEARSAL_BACKUP_PIDS:-128}
    logging: *logs
    environment: *environment
    volumes: *volumes
    tmpfs: *tmpfs
    networks: [rehearsal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python3', '/opt/komika-postgres/hosted.py', 'health']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10m
volumes:
  postgres-data:
    name: ${KOMIKA_REHEARSAL_PROJECT:?set rehearsal project}-postgres-data
    driver: local
    labels: *labels
  postgres-socket:
    name: ${KOMIKA_REHEARSAL_PROJECT:?set rehearsal project}-postgres-socket
    driver: local
    labels: *labels
networks:
  rehearsal:
    name: ${KOMIKA_REHEARSAL_PROJECT:?set rehearsal project}-network
    labels: *labels
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.21.0/24
