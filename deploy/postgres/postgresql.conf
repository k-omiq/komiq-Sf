# Only Compose can reach this listener; no PostgreSQL port is published.
listen_addresses = '*'
# Shared with the backup service; local postgres uses peer authentication.
unix_socket_directories = '/var/run/postgresql'
# One quarter of the PostgreSQL 4 GiB ceiling.
shared_buffers = '1GB'
# Planner cache estimate, not allocated memory.
effective_cache_size = '3GB'
# Per sort/hash operator, so concurrent queries can multiply this.
work_mem = '8MB'
# Bound index-build memory.
maintenance_work_mem = '256MB'
# Bound each autovacuum worker separately.
autovacuum_work_mem = '64MB'
# Application pools plus administration and backups.
max_connections = 48
# Recovery-relevant ceilings must also be retained by inspection restores.
max_worker_processes = 8
max_wal_senders = 10
max_prepared_transactions = 0
max_locks_per_transaction = 64
# Compress full-page images with modest CPU overhead.
wal_compression = zstd
# Checkpoint targets, NOT hard disk limits during archive outages.
max_wal_size = '2GB'
min_wal_size = '512MB'
# Reduce checkpoint churn; recovery time remains a rehearsal measurement.
checkpoint_timeout = '10min'
# Spread checkpoint I/O across the interval.
checkpoint_completion_target = 0.9
# Bound parallel query and index-build memory/CPU amplification.
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
# SSD random I/O is relatively cheap.
random_page_cost = 1.1
# Starting SSD prefetch concurrency; measure during Phase 6.
effective_io_concurrency = 200
# Surface slow statements without logging every query.
log_min_duration_statement = '1s'
# Surface contention after the deadlock probe interval.
log_lock_waits = on
deadlock_timeout = '1s'
# Observe checkpoint I/O and vacuum stalls.
log_checkpoints = on
log_autovacuum_min_duration = '10s'
# Pools own their session lifetime and set their own query/transaction timeouts.
idle_session_timeout = 0
# Never create MD5 password verifiers.
password_encryption = 'scram-sha-256'
# WAL must support physical recovery.
wal_level = replica
# Start wrapper disables this only when NO backup variables are configured.
archive_mode = on
# A five-minute switch avoids the spike's wasteful one-minute idle objects.
archive_timeout = 300
# Wrapper uses a private config file; errors and dropped-WAL warnings go to stderr.
archive_command = '/opt/komika-postgres/pgbackrest.sh archive-push "%p"'
# Docker bounds stdout/stderr; avoid another unbounded log directory.
logging_collector = off
