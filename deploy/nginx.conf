# nginx config for the reader SPA (adapter-static fallback: index.html).
#
# This file is an nginx *template*: the Dockerfile installs it as
# /etc/nginx/templates/default.conf.template and the stock nginx entrypoint runs
# envsubst on it at container start. Only ${CSP_*} vars are substituted (see
# NGINX_ENVSUBST_FILTER in reader.Dockerfile) so nginx runtime vars like $uri /
# $host survive untouched.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defence-in-depth; the reader is a static SPA).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy. Origins are env-driven (they differ per deploy /
    # image mode): CSP_IMG_ORIGIN is where page/cover images load from (the
    # Cloudflare image Worker in proxy mode, or the public Suwayomi host in direct
    # mode) and CSP_CONNECT_ORIGIN is the GraphQL API origin. Both may be empty
    # (same-origin only), in which case only 'self' applies. CSP_CONNECT_ORIGIN
    # also appears in img-src because the API origin serves user avatars
    # (`/avatars/...`), which the reader renders as <img>.
    #
    # 'unsafe-inline' is required for scripts and styles because adapter-static
    # emits a build-randomized inline bootstrap script (can't be statically
    # hashed) and the app uses inline style="" attributes (e.g. long-strip
    # aspect-ratios); static hosting can't issue per-request nonces. Everything
    # else is locked down: no plugins, no framing, no arbitrary connect/img.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ${CSP_IMG_ORIGIN} ${CSP_CONNECT_ORIGIN}; connect-src 'self' ${CSP_CONNECT_ORIGIN}; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite-hashed assets are content-addressed -> cache forever.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: serve index.html for any unmatched route so
    # client-side routing (/browse, /series/<slug>, /read/<slug>) resolves.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
