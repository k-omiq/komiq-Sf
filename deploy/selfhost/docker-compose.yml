# komiq, self-hosted. Install guide: docs/self-host.md
#
#   cd deploy/selfhost
#   docker compose up -d
#   docker compose logs server | grep "setup code"
#
# Then open http://<this machine>:8080/admin/setup and follow the steps.
# Reader at `/`, admin console at `/admin`, API and images on the same address.
#
# Services:
#   postgres     Main database, private to this stack.
#   server       komiq: API, reader, admin, image proxy. The only published port.
#   suwayomi     The source engine. It runs the extensions you install in the
#                admin console. Not published: its API has no authentication,
#                so only the server talks to it, over the internal network.
#   flaresolverr Optional. Solves "checking your browser" pages for sources
#                behind Cloudflare. Off unless you enable it in .env.
#
# Nothing here is set up for you: no extension repo, no MangaDex, no admin
# account. A fresh install opens the setup screens.

name: komiq

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    image: ${KOMIQ_IMAGE:-komiq-selfhost:local}
    restart: unless-stopped
    # The server drains requests and buffered writes within 20s.
    stop_grace_period: 30s
    # Reaps child processes (cloudflared, when a tunnel is set up) and forwards
    # stop signals.
    init: true
    environment:
      DATABASE_URL: postgres://komiq:${KOMIQ_DB_PASSWORD:?Run install.sh to generate KOMIQ_DB_PASSWORD in .env}@postgres:5432/komiq
      COVERS_DATABASE_URL: sqlite:///data/covers.sqlite3
      TZ: ${TZ:-UTC}
      # The port published below: the server names it in the addresses it suggests.
      # Inside the container it always listens on 8080.
      KOMIKA_PUBLISHED_PORT: ${KOMIQ_PORT:-8080}
    ports:
      # KOMIQ_BIND=0.0.0.0 (default): phones and other computers on your network
      # can open komiq. KOMIQ_BIND=127.0.0.1: this machine only, which is what you
      # want on a VPS that is reached through a Cloudflare Tunnel.
      - '${KOMIQ_BIND:-0.0.0.0}:${KOMIQ_PORT:-8080}:8080'
      # HTTPS and certificate checks use docker-compose.https.yml (443) and
      # docker-compose.acme.yml (80). Run install.sh, or set COMPOSE_FILE in
      # .env as shown in .env.example. No YAML edits are needed.
    volumes:
      - server-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: the setup screens work while the engine is still
      # booting, and the server retries the engine on its own.
      suwayomi:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }

  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    environment:
      # The bootstrap superuser can connect only over a local Unix socket.
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${KOMIQ_DB_PASSWORD:?Run install.sh to generate KOMIQ_DB_PASSWORD in .env}
      KOMIQ_DB_PASSWORD: ${KOMIQ_DB_PASSWORD:?Run install.sh to generate KOMIQ_DB_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --lc-collate=C --lc-ctype=C --auth-host=scram-sha-256
    command:
      # Bound the shared cache on a small host; other services need memory too.
      - -c
      - shared_buffers=256MB
      # Bound per-connection memory and leave room above the server's pools.
      - -c
      - max_connections=40
      # Reduce WAL disk traffic, trading a little CPU for compression.
      - -c
      - wal_compression=on
      - -c
      - password_encryption=scram-sha-256
    volumes:
      # PostgreSQL 18 uses versioned directories below /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-komiq.sh:ro
    healthcheck:
      # A TCP query as the application role proves SCRAM and database access.
      test: ['CMD-SHELL', 'PGPASSWORD="$$KOMIQ_DB_PASSWORD" psql -h 127.0.0.1 -U komiq -d komiq -Atqc "SELECT 1" | grep -qx 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }

  suwayomi:
    # Pinned by digest: the same Suwayomi release komiq.cc runs (v2.3.2243). An
    # update is a deliberate edit here, never whatever `pull` happens to fetch.
    image: ghcr.io/suwayomi/tachidesk@sha256:e59f212ccf91b26de8676a063a2db90256c148c6261535c7c477d47a43d9751b
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      BIND_IP: 0.0.0.0
      BIND_PORT: '4567'
      # komiq is the interface; the engine's own web UI is not used (and would be
      # downloaded from GitHub at every start).
      WEB_UI_ENABLED: 'false'
      FLARESOLVERR_ENABLED: ${FLARESOLVERR_ENABLED:-false}
      FLARESOLVERR_URL: http://flaresolverr:8191
      # Optional WARP egress (the `warp` service below). The engine applies the
      # SOCKS proxy to the whole JVM, so requests to FlareSolverr would go through
      # WARP too and fail; `http.nonProxyHosts` keeps them on the local network.
      SOCKS_PROXY_ENABLED: ${WARP_ENABLED:-false}
      SOCKS_PROXY_VERSION: '5'
      SOCKS_PROXY_HOST: warp
      SOCKS_PROXY_PORT: '1080'
      JAVA_TOOL_OPTIONS: -Dhttp.nonProxyHosts=flaresolverr|localhost|127.*|[::1]
    volumes:
      - engine-data:/home/suwayomi/.local/share/Tachidesk
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS http://localhost:4567/api/v1/settings/about >/dev/null || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }

  flaresolverr:
    # Enabled by COMPOSE_PROFILES=flaresolverr together with
    # FLARESOLVERR_ENABLED=true (see .env.example). Same pin as komiq.cc.
    profiles: [flaresolverr]
    image: ghcr.io/flaresolverr/flaresolverr@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    restart: unless-stopped
    # A headless browser: bound its memory so a runaway page cannot starve the
    # rest of the machine.
    mem_limit: 2g
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }

  warp:
    # Enabled by COMPOSE_PROFILES=warp together with WARP_ENABLED=true (see
    # .env.example). Cloudflare WARP in proxy mode: the engine's requests to
    # sources leave through Cloudflare instead of this machine's own address.
    # Starting it accepts Cloudflare's WARP terms and registers a free device.
    profiles: [warp]
    build: ./warp
    image: komiq-warp:local
    restart: unless-stopped
    # WARP installs routing rules for its own connection, even in proxy mode;
    # without this it never connects.
    cap_add: [NET_ADMIN]
    mem_limit: 256m
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }

volumes:
  # Covers and connector files.
  server-data:
  # Installed extensions and the engine's own database.
  engine-data:
  # Main accounts, library, catalogue and settings database.
  postgres-data:
  # WARP device registration (only with the warp profile).
  warp-data:
