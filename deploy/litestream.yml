# Litestream continuous-backup config for the Komika SQLite DB.
#
# Active only when the LITESTREAM_* env vars are set (see deploy/.env); the server
# entrypoint skips Litestream entirely otherwise. Litestream streams the WAL to an
# S3-compatible bucket (Cloudflare R2 recommended) and restores the latest snapshot
# on a fresh boot. Credentials come from the environment:
# LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY.
#
# R2 note: R2 has no regions — set LITESTREAM_REGION=auto and point
# LITESTREAM_ENDPOINT at https://<accountid>.r2.cloudflarestorage.com.
# force-path-style is required (R2 doesn't do virtual-host-style buckets).
#
# The replica's sync-interval/retention/snapshot-interval below bound R2 operation
# and storage cost to stay within the free tier (1M Class-A ops/mo, 10 GB storage).
dbs:
  - path: /data/komika.sqlite3
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: komika
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        force-path-style: true
        sync-interval: 10s        # fewer WAL PUTs during write bursts; RPO becomes ~10s
        retention: 24h            # bound WAL history kept in R2 (caps storage)
        snapshot-interval: 24h    # one base snapshot/day; keeps restore fast
